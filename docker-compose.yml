version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: inovacortex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inovacortex
    ports:
      - "5432:5432"
    volumes:
      - inovacortex_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  inovacortex_pgdata:
